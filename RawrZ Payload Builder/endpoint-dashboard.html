<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawrZ Endpoint Validator - Live Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', monospace;
            background: #0a0a0a;
            color: #00ff00;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #00ff00;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            text-shadow: 0 0 20px #00ff00;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1em;
        }
        
        /* Electricity Flow Animation */
        .electricity-container {
            position: relative;
            height: 100px;
            margin: 30px 0;
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .circuit-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #00ff00 20%, 
                #00ff00 80%, 
                transparent 100%);
            transform: translateY(-50%);
        }
        
        .electron {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            top: 50%;
            transform: translateY(-50%);
            animation: flow 2s linear infinite;
        }
        
        @keyframes flow {
            0% { left: -10px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }
        
        .electron.broken {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
            animation: flow 2s linear infinite, spark 0.5s ease-in-out infinite;
        }
        
        @keyframes spark {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.5); }
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }
        
        .stat-value {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-value.clean { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
        .stat-value.degraded { color: #ffaa00; text-shadow: 0 0 20px #ffaa00; }
        .stat-value.broken { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
        .stat-value.total { color: #00aaff; text-shadow: 0 0 20px #00aaff; }
        
        .stat-label {
            color: #888;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 2px;
        }
        
        /* Progress Bar */
        .progress-container {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            height: 30px;
            background: #222;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00aa00);
            border-radius: 15px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255,255,255,0.3) 50%, 
                transparent 100%);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* Batch Status */
        .batch-container {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .batch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .batch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px;
        }
        
        .batch-item {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .batch-item.clean {
            background: #00ff0022;
            border: 1px solid #00ff00;
            color: #00ff00;
        }
        
        .batch-item.degraded {
            background: #ffaa0022;
            border: 1px solid #ffaa00;
            color: #ffaa00;
        }
        
        .batch-item.broken {
            background: #ff000022;
            border: 1px solid #ff0000;
            color: #ff0000;
            animation: pulse 1s ease-in-out infinite;
        }
        
        .batch-item.pending {
            background: #333;
            border: 1px solid #555;
            color: #888;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Endpoint List */
        .endpoint-container {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .endpoint-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }
        
        .endpoint-item:hover {
            background: #1a1a1a;
        }
        
        .endpoint-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .endpoint-status.clean { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .endpoint-status.degraded { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; }
        .endpoint-status.broken { background: #ff0000; box-shadow: 0 0 10px #ff0000; }
        
        .endpoint-name {
            flex: 1;
            font-family: monospace;
            font-size: 0.95em;
        }
        
        .endpoint-voltage {
            width: 60px;
            text-align: right;
            font-weight: bold;
        }
        
        .endpoint-voltage.high { color: #00ff00; }
        .endpoint-voltage.medium { color: #ffaa00; }
        .endpoint-voltage.low { color: #ff0000; }
        
        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        button:hover {
            background: #00cc00;
            box-shadow: 0 0 20px #00ff00;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        button.secondary {
            background: transparent;
            border: 2px solid #00ff00;
            color: #00ff00;
        }
        
        button.secondary:hover {
            background: #00ff00;
            color: #000;
        }
        
        /* Log Output */
        .log-container {
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-line {
            padding: 3px 0;
            border-bottom: 1px solid #111;
        }
        
        .log-line.success { color: #00ff00; }
        .log-line.warning { color: #ffaa00; }
        .log-line.error { color: #ff0000; }
        .log-line.info { color: #00aaff; }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .batch-grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔌 RawrZ Endpoint Validator</h1>
            <p class="subtitle">Live Electricity Flow Monitor - Main → Preload → Renderer</p>
        </header>

        <!-- Electricity Animation -->
        <div class="electricity-container" id="electricityFlow">
            <div class="circuit-line"></div>
            <!-- Electrons will be added dynamically -->
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value total" id="totalCount">0</div>
                <div class="stat-label">Total Endpoints</div>
            </div>
            <div class="stat-card">
                <div class="stat-value clean" id="cleanCount">0</div>
                <div class="stat-label">Clean</div>
            </div>
            <div class="stat-card">
                <div class="stat-value degraded" id="degradedCount">0</div>
                <div class="stat-label">Degraded</div>
            </div>
            <div class="stat-card">
                <div class="stat-value broken" id="brokenCount">0</div>
                <div class="stat-label">Broken</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-header">
                <span>Validation Progress</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div style="margin-top: 10px; display: flex; justify-content: space-between; color: #888; font-size: 0.9em;">
                <span id="batchInfo">Batch 0 / 0</span>
                <span id="healthScore">Health: 0%</span>
            </div>
        </div>

        <!-- Batch Visualization -->
        <div class="batch-container">
            <div class="batch-header">
                <h3>📦 Batch Status</h3>
                <span id="batchLegend">🟢 Clean  🟡 Degraded  🔴 Broken</span>
            </div>
            <div class="batch-grid" id="batchGrid">
                <!-- Batch items will be added dynamically -->
            </div>
        </div>

        <!-- Endpoint List -->
        <div class="endpoint-container">
            <div class="batch-header">
                <h3>🔍 Endpoint Details</h3>
                <span>Click items for details</span>
            </div>
            <div id="endpointList">
                <!-- Endpoints will be added dynamically -->
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="startBtn" onclick="startValidation()">▶ Start Validation</button>
            <button id="stopBtn" class="secondary" onclick="stopValidation()" disabled>⏹ Stop</button>
            <button class="secondary" onclick="refreshData()">🔄 Refresh</button>
        </div>

        <!-- Log Output -->
        <div class="log-container" id="logOutput">
            <div class="log-line info">Ready to validate endpoints...</div>
        </div>
    </div>

    <script>
        // State
        let isRunning = false;
        let currentBatch = 0;
        let totalBatches = 0;
        let endpoints = [];
        let validationInterval = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            createElectrons();
            loadInitialData();
        });

        // Create electricity animation
        function createElectrons() {
            const container = document.getElementById('electricityFlow');
            const line = container.querySelector('.circuit-line');
            
            // Create flowing electrons
            for (let i = 0; i < 5; i++) {
                const electron = document.createElement('div');
                electron.className = 'electron';
                electron.style.animationDelay = `${i * 0.4}s`;
                container.appendChild(electron);
            }
        }

        // Update electron status based on validation
        function updateElectronics(healthPercent) {
            const electrons = document.querySelectorAll('.electron');
            electrons.forEach((el, i) => {
                if (healthPercent < 50) {
                    el.classList.add('broken');
                    el.style.animationDelay = `${i * 0.2}s`;
                } else if (healthPercent < 80) {
                    el.classList.remove('broken');
                    el.style.background = '#ffaa00';
                    el.style.boxShadow = '0 0 10px #ffaa00, 0 0 20px #ffaa00';
                } else {
                    el.classList.remove('broken');
                    el.style.background = '#00ff00';
                    el.style.boxShadow = '0 0 10px #00ff00, 0 0 20px #00ff00';
                }
            });
        }

        // Load initial data
        async function loadInitialData() {
            try {
                const response = await fetch('./logs/endpoint-report.json');
                if (response.ok) {
                    const data = await response.json();
                    updateDashboard(data);
                }
            } catch (e) {
                log('No previous validation data found', 'info');
            }
        }

        // Start validation
        async function startValidation() {
            if (isRunning) return;
            
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            log('Starting agentic endpoint validation...', 'info');
            
            // Simulate validation process
            await simulateValidation();
        }

        // Simulate validation (replace with actual API call)
        async function simulateValidation() {
            const totalEndpoints = 225;
            const batchSize = 20;
            totalBatches = Math.ceil(totalEndpoints / batchSize);
            
            // Generate mock endpoints
            endpoints = [];
            const endpointNames = [
                'app:get-version', 'app:select-file', 'app:select-files', 'app:select-directory',
                'app:compress-file', 'app:decompress-file', 'app:hash-file', 'app:encrypt-file',
                'app:decrypt-file', 'app:show-save-dialog', 'app:show-message-box', 'app:open-external',
                'rawrz:get-engines', 'rawrz:execute', 'rawrz:get-health', 'rawrz:generate-stub',
                'rawrz:burn-stub', 'rawrz:protect-bot', 'rawrz:obfuscate-bot', 'rawrz:encrypt-payload',
                'rawrz:decrypt-payload', 'rawrz:generate-bot', 'rawrz:analyze-malware', 'rawrz:scan-cve',
                'rawrz:beacon-deploy', 'rawrz:deploy-agent', 'rawrz:mutate-agent', 'rawrz:get-system-status',
                'rawrz:get-engine-health', 'rawrz:apply-hotpatch', 'rawrz:execute-win32', 'rawrz:generate-omega'
            ];
            
            for (let i = 0; i < totalEndpoints; i++) {
                const name = endpointNames[i % endpointNames.length] + (i >= endpointNames.length ? `-${Math.floor(i/endpointNames.length)}` : '');
                const rand = Math.random();
                let status, voltage;
                
                if (rand > 0.7) {
                    status = '';
                    voltage = 100;
                } else if (rand > 0.4) {
                    status = 'DEGRADED';
                    voltage = Math.floor(Math.random() * 40) + 60;
                } else {
                    status = 'BROKEN';
                    voltage = Math.floor(Math.random() * 60);
                }
                
                endpoints.push({
                    channel: name,
                    status,
                    voltage,
                    batch: Math.floor(i / batchSize)
                });
            }
            
            // Process batches
            for (let batch = 0; batch < totalBatches; batch++) {
                if (!isRunning) break;
                
                currentBatch = batch + 1;
                const batchEndpoints = endpoints.filter(e => e.batch === batch);
                
                log(`Processing batch ${currentBatch}/${totalBatches}...`, 'info');
                
                // Update batch display
                updateBatchGrid();
                
                // Simulate processing time
                await new Promise(r => setTimeout(r, 500));
                
                // Update dashboard
                updateDashboardFromEndpoints();
            }
            
            if (isRunning) {
                log('Validation complete!', 'success');
            }
            
            stopValidation();
        }

        // Update batch grid
        function updateBatchGrid() {
            const grid = document.getElementById('batchGrid');
            grid.innerHTML = '';
            
            endpoints.forEach((ep, i) => {
                const item = document.createElement('div');
                item.className = `batch-item ${ep.status.toLowerCase() || 'clean'}`;
                item.textContent = i + 1;
                item.title = `${ep.channel}\nStatus: ${ep.status || 'CLEAN'}\nVoltage: ${ep.voltage}%`;
                grid.appendChild(item);
            });
        }

        // Update dashboard from endpoints
        function updateDashboardFromEndpoints() {
            const clean = endpoints.filter(e => e.status === '').length;
            const degraded = endpoints.filter(e => e.status === 'DEGRADED').length;
            const broken = endpoints.filter(e => e.status === 'BROKEN').length;
            const total = endpoints.length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('cleanCount').textContent = clean;
            document.getElementById('degradedCount').textContent = degraded;
            document.getElementById('brokenCount').textContent = broken;
            
            const percent = Math.round((clean / total) * 100);
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('progressPercent').textContent = `${percent}%`;
            document.getElementById('batchInfo').textContent = `Batch ${currentBatch} / ${totalBatches}`;
            document.getElementById('healthScore').textContent = `Health: ${percent}%`;
            
            updateElectronics(percent);
            updateEndpointList();
        }

        // Update endpoint list
        function updateEndpointList() {
            const list = document.getElementById('endpointList');
            list.innerHTML = '';
            
            // Show first 50 endpoints
            endpoints.slice(0, 50).forEach(ep => {
                const item = document.createElement('div');
                item.className = 'endpoint-item';
                
                const statusClass = ep.status.toLowerCase() || 'clean';
                const voltageClass = ep.voltage >= 80 ? 'high' : ep.voltage >= 60 ? 'medium' : 'low';
                
                item.innerHTML = `
                    <div class="endpoint-status ${statusClass}"></div>
                    <div class="endpoint-name">${ep.channel}</div>
                    <div class="endpoint-voltage ${voltageClass}">${ep.voltage}%</div>
                `;
                
                list.appendChild(item);
            });
        }

        // Update dashboard from report data
        function updateDashboard(data) {
            if (!data || !data.summary) return;
            
            document.getElementById('totalCount').textContent = data.summary.total;
            document.getElementById('cleanCount').textContent = data.summary.clean;
            document.getElementById('degradedCount').textContent = data.summary.degraded;
            document.getElementById('brokenCount').textContent = data.summary.broken;
            
            const percent = data.summary.healthPercentage || 0;
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('progressPercent').textContent = `${percent}%`;
            document.getElementById('healthScore').textContent = `Health: ${percent}%`;
            
            updateElectronics(percent);
        }

        // Stop validation
        function stopValidation() {
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            log('Validation stopped', 'warning');
        }

        // Refresh data
        async function refreshData() {
            log('Refreshing data...', 'info');
            await loadInitialData();
            log('Data refreshed', 'success');
        }

        // Log message
        function log(message, type = 'normal') {
            const output = document.getElementById('logOutput');
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
